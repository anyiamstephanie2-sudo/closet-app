<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Closet</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1B1A1E">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1B1A1E; --paper:#F5F1E8; --paper-dim:#EAE4D6;
    --tan:#B8935A; --sage:#4A5D45; --brick:#8B2F2F; --line:rgba(27,26,30,0.14);
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper-dim);font-family:'Inter',sans-serif;color:var(--ink);}
  #app{max-width:420px;margin:0 auto;min-height:100vh;background:var(--paper);display:flex;flex-direction:column;box-shadow:0 0 40px rgba(0,0,0,0.08);}
  header.top{padding:22px 20px 16px;border-bottom:1px solid var(--line);}
  header.top .logo{font-family:'Fraunces',serif;font-size:24px;font-weight:600;}
  main{flex:1;overflow-y:auto;padding:20px;padding-bottom:90px;}
  .hidden{display:none !important;}
  .error-banner{margin:0 0 14px;padding:10px 14px;background:#fdeaea;color:var(--brick);font-size:13px;border-radius:3px;}

  /* Closet score */
  .score-card{background:var(--ink);color:var(--paper);border-radius:6px;padding:18px;margin-bottom:18px;display:flex;align-items:center;gap:16px;}
  .score-ring{position:relative;width:56px;height:56px;flex-shrink:0;}
  .score-ring svg{transform:rotate(-90deg);}
  .score-pct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;}
  .score-label{font-size:11px;opacity:0.65;text-transform:uppercase;letter-spacing:0.04em;}
  .score-msg{font-size:13.5px;margin-top:3px;}

  /* Add item */
  .add-btn{display:flex;align-items:center;justify-content:center;gap:8px;border:1.5px dashed var(--ink);border-radius:4px;padding:18px;cursor:pointer;margin-bottom:20px;font-size:14px;font-weight:500;background:none;width:100%;color:var(--ink);transition:transform .12s ease;}
  .add-btn:active{transform:scale(0.97);}
  .empty-msg{text-align:center;color:#777;font-size:14px;margin-top:30px;}

  /* Wardrobe grid */
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .item-card{background:#fff;border-radius:4px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,0.06);}
  .item-card img{width:100%;height:130px;object-fit:cover;display:block;background:var(--paper-dim);}
  .item-card .body{padding:10px;}
  .item-card .name{font-size:13px;font-weight:600;}
  .item-card .meta{font-size:11px;color:#888;margin-top:2px;}
  .item-card .row{display:flex;justify-content:space-between;align-items:center;margin-top:8px;}
  .wear-btn{border:1px solid var(--ink);background:none;border-radius:3px;padding:3px 8px;font-size:11px;cursor:pointer;transition:transform .12s ease;}
  .wear-btn:active{transform:scale(0.9);}
  .listed-tag{margin-top:8px;background:var(--sage);color:#fff;font-size:11px;padding:4px 8px;border-radius:2px;display:inline-block;}

  /* Outfits */
  .gen-btn{width:100%;background:var(--ink);color:var(--paper);border:none;padding:14px;border-radius:4px;font-size:14px;font-weight:500;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:22px;transition:transform .12s ease;}
  .gen-btn:active{transform:scale(0.97);}
  .card-stack{position:relative;height:270px;}
  .outfit-card{position:absolute;inset:0;background:#fff;border-radius:8px;padding:20px;box-shadow:0 10px 30px rgba(0,0,0,0.14);cursor:grab;user-select:none;touch-action:pan-y;}
  .outfit-card .title{font-family:'Fraunces',serif;font-size:19px;font-weight:600;margin-bottom:10px;}
  .outfit-card .imgs{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap;}
  .outfit-card .imgs img{width:64px;height:64px;object-fit:cover;border-radius:4px;background:var(--paper-dim);}
  .outfit-card .note{font-size:12.5px;color:var(--tan);font-weight:500;}
  .outfit-card .hint{margin-top:16px;font-size:11.5px;opacity:0.45;text-align:center;}
  .swipe-actions{display:flex;justify-content:center;gap:30px;margin-top:24px;}
  .circle-btn{width:48px;height:48px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .12s ease;border:1.5px solid var(--line);}
  .circle-btn:active{transform:scale(0.9);}
  .circle-btn.save{border-color:var(--tan);}
  .saved-list{margin-top:34px;}
  .saved-list .heading{font-size:13px;font-weight:600;margin-bottom:10px;}
  .saved-item{background:#fff;border-radius:4px;padding:12px;margin-bottom:8px;font-size:12.5px;box-shadow:0 2px 8px rgba(0,0,0,0.05);}
  .done-msg{text-align:center;padding:30px 0;color:#777;font-size:14px;}
  .done-msg .sub{color:#999;font-size:12.5px;margin-top:6px;}

  /* Resell */
  .resell-hint{font-size:13px;color:#777;margin-bottom:16px;}
  .resell-item{display:flex;gap:12px;background:#fff;border-radius:4px;padding:12px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,0.06);}
  .resell-item img{width:60px;height:60px;object-fit:cover;border-radius:3px;background:var(--paper-dim);}
  .price-btn{background:var(--brick);color:#fff;border:none;padding:6px 12px;border-radius:3px;font-size:11px;cursor:pointer;transition:transform .12s ease;}
  .price-btn:active{transform:scale(0.94);}

  /* Bottom nav */
  nav.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:420px;display:flex;border-top:1px solid var(--line);background:var(--paper);}
  nav.bottom button{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 0;background:none;border:none;cursor:pointer;color:#999;transition:transform .15s ease,color .15s ease;}
  nav.bottom button.active{color:var(--ink);transform:scale(1.05);}
  nav.bottom svg{width:20px;height:20px;}
  nav.bottom span{font-size:11px;}
  nav.bottom button.active span{font-weight:600;}

  /* Modal */
  .modal-overlay{position:fixed;inset:0;background:rgba(27,26,30,0.5);display:flex;align-items:flex-end;justify-content:center;z-index:200;}
  .modal-overlay.hidden{display:none;}
  .modal{background:var(--paper);width:100%;max-width:420px;border-radius:12px 12px 0 0;padding:24px 20px 30px;}
  .modal h3{font-family:'Fraunces',serif;font-size:19px;margin:0 0 16px;}
  .modal label{display:block;font-size:12px;font-weight:500;margin-bottom:5px;margin-top:14px;}
  .modal input, .modal select{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:4px;font-family:'Inter',sans-serif;font-size:14px;background:#fff;color:var(--ink);}
  .modal .modal-actions{display:flex;gap:10px;margin-top:22px;}
  .modal .btn-primary{flex:1;background:var(--ink);color:var(--paper);border:none;padding:12px;border-radius:4px;font-size:14px;font-weight:500;cursor:pointer;}
  .modal .btn-secondary{flex:1;background:none;border:1.5px solid var(--ink);color:var(--ink);padding:12px;border-radius:4px;font-size:14px;font-weight:500;cursor:pointer;}
  .preview-img{width:100%;height:140px;object-fit:cover;border-radius:4px;margin-top:12px;background:var(--paper-dim);}

  /* Confetti */
  #confetti-layer{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:999;}
  .confetti-piece{position:absolute;top:-10px;width:8px;height:12px;border-radius:1px;animation:confetti-fall linear forwards;}
  @keyframes confetti-fall{ to { top:100%; transform:translateX(var(--drift)) rotate(540deg); } }
</style>
</head>
<body>
<div id="app">
  <header class="top"><div class="logo">Closet</div></header>
  <div id="errorBanner" class="error-banner hidden"></div>
  <main id="main"></main>
  <nav class="bottom">
    <button data-tab="wardrobe" class="active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 4l6 3 6-3 3 3-4 3v11H7V10L3 7z"/></svg>
      <span>Wardrobe</span>
    </button>
    <button data-tab="outfits">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 2l1.5 4.5L18 8l-4.5 1.5L12 14l-1.5-4.5L6 8l4.5-1.5z"/><path d="M19 14l.7 2 2 .7-2 .7-.7 2-.7-2-2-.7 2-.7z"/></svg>
      <span>Outfits</span>
    </button>
    <button data-tab="resell">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20.6 12.9L11 3.3H4v7l9.6 9.6a1 1 0 0 0 1.4 0l5.6-5.6a1 1 0 0 0 0-1.4z"/><circle cx="8" cy="8" r="1.2" fill="currentColor"/></svg>
      <span>Resell</span>
    </button>
  </nav>
</div>

<div id="modalOverlay" class="modal-overlay hidden">
  <div class="modal">
    <h3>Add a wardrobe item</h3>
    <label>Photo (optional)</label>
    <input type="file" id="photoInput" accept="image/*">
    <img id="photoPreview" class="preview-img hidden">
    <label>Name</label>
    <input type="text" id="nameInput" placeholder="e.g. Denim jacket">
    <label>Category</label>
    <select id="categoryInput">
      <option value="top">Top</option>
      <option value="bottom">Bottom</option>
      <option value="dress">Dress</option>
      <option value="outerwear">Outerwear</option>
      <option value="shoes">Shoes</option>
      <option value="accessory">Accessory</option>
    </select>
    <label>Color</label>
    <input type="text" id="colorInput" placeholder="e.g. blue">
    <label>Style</label>
    <input type="text" id="styleInput" placeholder="e.g. casual">
    <div class="modal-actions">
      <button class="btn-secondary" id="cancelAdd">Cancel</button>
      <button class="btn-primary" id="confirmAdd">Add item</button>
    </div>
  </div>
</div>

<div id="confetti-layer"></div>

<script>
const COLORS = { tan:"#B8935A", sage:"#4A5D45", brick:"#8B2F2F", extra:"#E8D5B5" };
const PRICE_BASE = { top:3000, bottom:4000, dress:6000, outerwear:8000, shoes:5000, accessory:1500 };

let state = {
  items: JSON.parse(localStorage.getItem("closet-items") || "[]"),
  savedOutfits: JSON.parse(localStorage.getItem("closet-saved-outfits") || "[]"),
  tab: "wardrobe",
  outfits: [],
  outfitIndex: 0,
  pendingPhoto: null,
};

function persistItems(){ localStorage.setItem("closet-items", JSON.stringify(state.items)); }
function persistSaved(){ localStorage.setItem("closet-saved-outfits", JSON.stringify(state.savedOutfits)); }

function showError(msg){
  const el = document.getElementById("errorBanner");
  el.textContent = msg;
  el.classList.remove("hidden");
  setTimeout(() => el.classList.add("hidden"), 3500);
}

function fireConfetti(){
  const layer = document.getElementById("confetti-layer");
  const palette = [COLORS.tan, COLORS.sage, COLORS.brick, COLORS.extra];
  for(let i=0;i<26;i++){
    const p = document.createElement("span");
    p.className = "confetti-piece";
    const left = Math.random()*100;
    const delay = Math.random()*0.15;
    const duration = 0.9+Math.random()*0.6;
    const drift = (Math.random()-0.5)*60;
    p.style.left = left+"%";
    p.style.background = palette[i % palette.length];
    p.style.transform = `rotate(${Math.random()*360}deg)`;
    p.style.animationDuration = duration+"s";
    p.style.animationDelay = delay+"s";
    p.style.setProperty("--drift", drift+"px");
    layer.appendChild(p);
    setTimeout(() => p.remove(), (duration+delay+0.1)*1000);
  }
}

function renderScoreCard(){
  const total = state.items.length;
  const worn = state.items.filter(i => i.wearCount > 0).length;
  const pct = total === 0 ? 0 : Math.round((worn/total)*100);
  let msg = "Add items to see your closet score.";
  if(total > 0){
    if(pct >= 70) msg = "Your closet is earning its keep.";
    else if(pct >= 35) msg = "Halfway there — keep it moving.";
    else msg = "Plenty of room to put things in rotation.";
  }
  const r = 24, circ = 2*Math.PI*r;
  const offset = circ * (1 - pct/100);
  return `
    <div class="score-card">
      <div class="score-ring">
        <svg width="56" height="56">
          <circle cx="28" cy="28" r="${r}" fill="none" stroke="rgba(245,241,232,0.18)" stroke-width="5"/>
          <circle cx="28" cy="28" r="${r}" fill="none" stroke="${COLORS.tan}" stroke-width="5" stroke-linecap="round"
            stroke-dasharray="${circ}" stroke-dashoffset="${offset}" style="transition:stroke-dashoffset .6s ease"/>
        </svg>
        <div class="score-pct">${pct}%</div>
      </div>
      <div>
        <div class="score-label">Closet score</div>
        <div class="score-msg">${msg}</div>
      </div>
    </div>`;
}

function renderWardrobe(){
  const grid = state.items.map(item => `
    <div class="item-card">
      ${item.image ? `<img src="${item.image}" alt="${item.name}">` : `<div style="height:130px;background:var(--paper-dim);"></div>`}
      <div class="body">
        <div class="name">${item.name}</div>
        <div class="meta">${item.color} · ${item.style}</div>
        <div class="row">
          <span class="meta">Worn ${item.wearCount}x</span>
          <button class="wear-btn" onclick="incrementWear('${item.id}')">+1 wear</button>
        </div>
        ${item.forSale ? `<div class="listed-tag">Listed ₦${item.price.toLocaleString()}</div>` : ""}
      </div>
    </div>`).join("");

  return `
    ${renderScoreCard()}
    <button class="add-btn" onclick="openModal()">+ Add a wardrobe item</button>
    ${state.items.length === 0 ? `<p class="empty-msg">Your wardrobe is empty. Add your first item above.</p>` : `<div class="grid">${grid}</div>`}
  `;
}

function generateRuleBasedOutfits(){
  const byCategory = {};
  state.items.forEach(i => { (byCategory[i.category] = byCategory[i.category] || []).push(i); });
  const outfits = [];
  const noteBank = ["A clean, easy pairing.", "Comfortable and put-together.", "Good for a casual day out.", "Simple and versatile."];

  function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

  for(let attempt=0; attempt<4; attempt++){
    let combo = [];
    if(byCategory.dress && byCategory.dress.length){
      combo.push(pick(byCategory.dress));
    } else if(byCategory.top && byCategory.bottom){
      combo.push(pick(byCategory.top));
      combo.push(pick(byCategory.bottom));
    } else {
      continue;
    }
    if(byCategory.shoes && Math.random() > 0.2) combo.push(pick(byCategory.shoes));
    if(byCategory.outerwear && Math.random() > 0.5) combo.push(pick(byCategory.outerwear));
    if(byCategory.accessory && Math.random() > 0.5) combo.push(pick(byCategory.accessory));

    const ids = combo.map(i => i.id);
    const title = combo.map(i => i.name).slice(0,2).join(" + ");
    outfits.push({ title: title || "Outfit idea", itemIds: ids, note: pick(noteBank) });
  }
  return outfits;
}

function renderOutfits(){
  let body = `<button class="gen-btn" onclick="handleGenerate()">✦ Generate today's outfits</button>`;

  if(state.outfits.length === 0){
    body += `<p class="empty-msg" style="margin-top:0;">Tap above to get outfit ideas from what's already in your closet.</p>`;
  } else if(state.outfitIndex >= state.outfits.length){
    body += `<div class="done-msg">That's all for today.<div class="sub">${state.savedOutfits.length} outfit${state.savedOutfits.length===1?"":"s"} saved so far.</div></div>`;
  } else {
    const outfit = state.outfits[state.outfitIndex];
    const imgs = outfit.itemIds.map(id => {
      const it = state.items.find(i => i.id === id);
      return it && it.image ? `<img src="${it.image}">` : "";
    }).join("");
    body += `
      <div class="card-stack">
        <div class="outfit-card" id="topCard">
          <div class="title">${outfit.title}</div>
          <div class="imgs">${imgs}</div>
          <div class="note">${outfit.note}</div>
          <div class="hint">← swipe to skip · swipe to save →</div>
        </div>
      </div>
      <div class="swipe-actions">
        <button class="circle-btn" onclick="handleSwipe('left')">✕</button>
        <button class="circle-btn save" onclick="handleSwipe('right')">♥</button>
      </div>`;
  }

  if(state.savedOutfits.length > 0){
    body += `<div class="saved-list"><div class="heading">Saved outfits</div>${state.savedOutfits.map(o => `<div class="saved-item">${o.title}</div>`).join("")}</div>`;
  }
  return body;
}

function renderResell(){
  const unworn = state.items.filter(i => i.wearCount === 0 && !i.forSale);
  let body = `<p class="resell-hint">Items you haven't worn yet — flag one for resale and get a suggested price.</p>`;
  if(unworn.length === 0){
    body += `<p class="empty-msg">Nothing unworn right now. Everything's earning its space.</p>`;
  } else {
    body += unworn.map(item => `
      <div class="resell-item">
        ${item.image ? `<img src="${item.image}">` : `<div style="width:60px;height:60px;background:var(--paper-dim);border-radius:3px;"></div>`}
        <div style="flex:1;">
          <div class="name" style="font-size:13px;font-weight:600;">${item.name}</div>
          <div class="meta" style="margin-bottom:8px;">${item.color} · ${item.style}</div>
          <button class="price-btn" onclick="suggestPrice('${item.id}')">Get resale price</button>
        </div>
      </div>`).join("");
  }
  return body;
}

function render(){
  const main = document.getElementById("main");
  if(state.tab === "wardrobe") main.innerHTML = renderWardrobe();
  else if(state.tab === "outfits") main.innerHTML = renderOutfits();
  else main.innerHTML = renderResell();

  document.querySelectorAll("nav.bottom button").forEach(btn => {
    btn.classList.toggle("active", btn.dataset.tab === state.tab);
  });

  if(state.tab === "outfits" && state.outfits.length > 0 && state.outfitIndex < state.outfits.length){
    attachSwipe(document.getElementById("topCard"));
  }
}

function switchTab(tab){ state.tab = tab; render(); }

function incrementWear(id){
  const item = state.items.find(i => i.id === id);
  if(item){ item.wearCount++; persistItems(); render(); }
}

function handleGenerate(){
  if(state.items.length < 2){
    showError("Add at least 2 items to generate outfits.");
    return;
  }
  const outfits = generateRuleBasedOutfits();
  if(outfits.length === 0){
    showError("Add at least a top + bottom, or a dress, to generate outfits.");
    return;
  }
  state.outfits = outfits;
  state.outfitIndex = 0;
  render();
}

function handleSwipe(direction){
  const outfit = state.outfits[state.outfitIndex];
  if(direction === "right"){
    state.savedOutfits.unshift(outfit);
    persistSaved();
    fireConfetti();
  }
  state.outfitIndex++;
  render();
}

function attachSwipe(card){
  if(!card) return;
  let startX = 0, dragging = false, dragX = 0;
  function onDown(x){ startX = x; dragging = true; card.style.transition = "none"; card.style.cursor = "grabbing"; }
  function onMove(x){ if(!dragging) return; dragX = x - startX; card.style.transform = `translateX(${dragX}px) rotate(${dragX/18}deg)`; card.style.opacity = 1 - Math.min(Math.abs(dragX)/300, 0.5); }
  function onUp(){
    if(!dragging) return;
    dragging = false;
    card.style.transition = "transform .3s ease, opacity .3s ease";
    card.style.cursor = "grab";
    if(Math.abs(dragX) > 100){ handleSwipe(dragX > 0 ? "right" : "left"); }
    else { card.style.transform = "none"; card.style.opacity = 1; }
    dragX = 0;
  }
  card.addEventListener("mousedown", e => onDown(e.clientX));
  card.addEventListener("mousemove", e => onMove(e.clientX));
  card.addEventListener("mouseup", onUp);
  card.addEventListener("mouseleave", () => dragging && onUp());
  card.addEventListener("touchstart", e => onDown(e.touches[0].clientX));
  card.addEventListener("touchmove", e => onMove(e.touches[0].clientX));
  card.addEventListener("touchend", onUp);
}

function suggestPrice(id){
  const item = state.items.find(i => i.id === id);
  if(!item) return;
  const base = PRICE_BASE[item.category] || 3000;
  const price = Math.round(base * 0.95); // slight discount for pre-owned, unworn condition is near-new
  item.forSale = true;
  item.price = price;
  persistItems();
  fireConfetti();
  render();
}

/* Modal handling */
function openModal(){
  document.getElementById("modalOverlay").classList.remove("hidden");
  document.getElementById("nameInput").value = "";
  document.getElementById("colorInput").value = "";
  document.getElementById("styleInput").value = "";
  document.getElementById("photoInput").value = "";
  document.getElementById("photoPreview").classList.add("hidden");
  state.pendingPhoto = null;
}
function closeModal(){ document.getElementById("modalOverlay").classList.add("hidden"); }

document.getElementById("cancelAdd").addEventListener("click", closeModal);
document.getElementById("photoInput").addEventListener("change", (e) => {
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    state.pendingPhoto = reader.result;
    const preview = document.getElementById("photoPreview");
    preview.src = reader.result;
    preview.classList.remove("hidden");
  };
  reader.readAsDataURL(file);
});
document.getElementById("confirmAdd").addEventListener("click", () => {
  const name = document.getElementById("nameInput").value.trim();
  if(!name){ showError("Give the item a name."); return; }
  const item = {
    id: Date.now().toString(),
    image: state.pendingPhoto,
    name,
    category: document.getElementById("categoryInput").value,
    color: document.getElementById("colorInput").value.trim() || "unspecified",
    style: document.getElementById("styleInput").value.trim() || "everyday",
    wearCount: 0,
    forSale: false,
    price: null,
  };
  state.items.unshift(item);
  persistItems();
  closeModal();
  fireConfetti();
  render();
});

document.querySelectorAll("nav.bottom button").forEach(btn => {
  btn.addEventListener("click", () => switchTab(btn.dataset.tab));
});

/* Register service worker */
if("serviceWorker" in navigator){
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
